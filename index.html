<meta charset="utf-8">
<title>Hexmoor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{
  --bg:#0f1a24; --panel:rgba(13,22,31,.84); --panel2:rgba(20,32,44,.96); --line:rgba(233,225,204,.12);
  --ink:#e9e1cc; --muted:#a4a999; --brass:#c9962e; --brass-ink:#1c1406; --danger:#c8392b; --good:#5da65b;
  --wood:#3f7a3a; --brick:#b5532e; --sheep:#9ccc65; --wheat:#e6c14a; --ore:#8a94a3;
  --display:Cinzel,"Trajan Pro",Georgia,serif; --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 45%,#3a8bcc 0%,#2468a6 55%,#174a7d 100%);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;overflow:hidden;color-scheme:dark}
#board{position:fixed;left:278px;top:56px;width:calc(100% - 292px);height:calc(100% - 56px - 118px);display:block;user-select:none}
#board .num{font-family:var(--display);font-weight:700;font-size:.3px}
#board .tile{transition:filter .3s}
#board .tile.glow{animation:glow .9s ease-out}
@keyframes glow{0%{filter:brightness(1)}30%{filter:brightness(1.45) drop-shadow(0 0 .12px #fff6c8)}100%{filter:brightness(1)}}
#board .pop{transform-box:fill-box;transform-origin:center;animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
#board .robber{transition:transform .45s cubic-bezier(.4,1.4,.5,1)}
#board .mk{cursor:pointer;animation:mk 1.1s ease-in-out infinite}
#board .mk:hover{animation:none;opacity:1;filter:brightness(1.3)}
#board .mk-hex{animation-name:mkhex}
@keyframes mk{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes mkhex{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
#dice{display:flex;gap:8px;padding:7px 10px;margin-left:10px;pointer-events:auto}
#dice[hidden]{display:none}
.die{width:30px;height:30px;border-radius:6px;background:#f6edd3;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px;box-sizing:border-box;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.die i{display:block;margin:auto;width:6px;height:6px;border-radius:50%}
.die i.on{background:#22180f}
#dice.rolling .die{animation:shake .14s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
#hud{position:fixed;inset:0;pointer-events:none;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
#hud>*{pointer-events:auto}
.panel{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#topbar{display:flex;justify-content:center;align-items:center;pointer-events:none}
#status{pointer-events:auto;padding:8px 18px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;text-align:center;max-width:min(560px,70vw);text-wrap:balance}
#status .dice{color:var(--brass);margin-left:8px}
#players{position:absolute;left:14px;top:14px;width:250px;display:flex;flex-direction:column;gap:8px}
#players .pl{font-size:16px}
#players.many{gap:5px}#players.many .pl{padding:5px 10px}
#players .pl .pv{font-size:22px}
.pl{display:grid;grid-template-columns:12px 1fr auto;column-gap:8px;row-gap:2px;align-items:center;padding:8px 10px;font-size:14px}
.pl.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset,0 10px 30px rgba(0,0,0,.35)}
.pl .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
.pl .pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pn small{color:var(--muted);font-weight:400;margin-left:4px}
.pl .pv{font-family:var(--display);font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums}
.pl .pm{grid-column:2/4;color:var(--muted);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:0 6px;border-radius:4px;background:rgba(201,150,46,.18);color:var(--brass);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#logwrap{position:absolute;right:12px;top:12px;width:256px;max-height:44vh;display:flex;flex-direction:column;overflow:hidden}
#logtitle{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 6px;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);border-bottom:1px solid var(--line)}
#logtitle button{padding:2px 8px;font-size:12px}
#log{overflow-y:auto;padding:6px 10px 8px;font-size:13px;line-height:1.4}
#log div{padding:2px 0;border-bottom:1px dotted rgba(233,225,204,.08)}
#log div:last-child{border-bottom:0}
#logwrap.collapsed{max-height:none}
#logwrap.collapsed #log{display:none}
#bottom{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#modebar{padding:8px 14px;display:flex;gap:12px;align-items:center;font-weight:500;border-color:var(--brass)}
#hand{width:min(820px,100%);padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;background:rgba(13,22,31,.78)}
.hhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hhead .who{font-family:var(--display);font-weight:700;font-size:15px}
.hhead .sub{color:var(--muted);font-size:13px}
.hhead .spacer{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:52px;padding:3px 7px 4px;border-radius:7px;background:rgba(233,225,204,.05);border-top:3px solid var(--c);text-align:center;font-variant-numeric:tabular-nums}
.chip b{display:block;font-size:17px;font-family:var(--display);line-height:1.1}
.chip small{color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.chip.zero b{color:var(--muted)}
.chip .rate{font-size:11px;color:var(--brass);display:block}
.devs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dev{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;border-radius:7px;background:rgba(201,150,46,.10);border:1px solid rgba(201,150,46,.25);font-size:13.5px}
.dev button{padding:3px 9px;font-size:12.5px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions.duel .tok{align-self:center;color:var(--brass);font-weight:700;margin-right:4px}
#players .pl.neutral{opacity:.8}
button{font:inherit;font-weight:500;color:var(--ink);background:rgba(233,225,204,.08);border:1px solid rgba(233,225,204,.14);border-radius:7px;padding:6px 11px;cursor:pointer;transition:background .12s}
button:hover:not(:disabled){background:rgba(233,225,204,.16)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
button.primary:hover:not(:disabled){background:#dba93f}
button.quiet{background:transparent;border-color:transparent;color:var(--muted)}
button.small{padding:3px 8px;font-size:12.5px}
.cost{color:var(--muted);font-size:11.5px;margin-left:4px}
.overlay{position:fixed;inset:0;background:rgba(6,10,14,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 20px 16px;width:min(540px,100%);max-height:90vh;overflow:auto;box-sizing:border-box;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.modal h2{font-family:var(--display);margin:0 0 6px;font-size:20px;color:var(--brass);letter-spacing:.02em}
.modal p{margin:6px 0 10px;color:var(--ink)}
.modal .hint{color:var(--muted);font-size:13px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;background:rgba(233,225,204,.04)}
.row .lbl{display:flex;align-items:center;gap:8px}
.row .sw{width:10px;height:10px;border-radius:2px}
.counter{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.counter button{width:30px;height:30px;padding:0;font-size:18px;line-height:1}
.counter span{min-width:22px;text-align:center;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two h3{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button.on{background:rgba(201,150,46,.2);border-color:var(--brass);color:var(--brass)}
.setup-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0}
.setup-row input{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.setup-row select,.field select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:#1a2a39;color:var(--ink)}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.field label{color:var(--ink)}
.field label .hint{display:block;font-size:12.5px}
.variants{border-top:1px solid var(--line);padding-top:6px}.variants h3{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 4px}
label.variant{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:5px 0;cursor:pointer}label.variant input{margin-top:3px}
label.variant b{display:block;font-weight:700}label.variant small{color:var(--muted);font-size:12.5px}
.field .pick{display:flex;gap:6px;align-items:center}
.title{font-family:var(--display);font-size:34px;letter-spacing:.06em;color:var(--brass);margin:0;text-align:center}
.tagline{text-align:center;color:var(--muted);margin:2px 0 14px;font-style:italic}
.victim{display:flex;gap:8px;flex-wrap:wrap}
.trade-modal{width:min(640px,100%)}
.trade h3{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.seg{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.28);border-radius:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;font-size:15px}
.seg button.on{background:var(--brass);color:var(--brass-ink);font-weight:700}
.rtiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rcol{display:flex;flex-direction:column;gap:4px}
.rtile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:9px;border:2px solid transparent;border-top:6px solid var(--c);background:rgba(233,225,204,.06)}
.rtile b{font-family:var(--display);font-size:20px;line-height:1.15;white-space:nowrap}
.rtile .rt-name{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rtile small{font-size:12px;color:var(--muted)}
.rtile.on{border-color:var(--brass);background:rgba(201,150,46,.2)}
.rtile:disabled{opacity:.3}
.step{display:flex;gap:4px}.step button{flex:1;padding:2px 0;font-size:17px}
.summary{text-align:center;font-family:var(--display);font-size:17px;color:var(--brass);margin:16px 0 2px;min-height:24px}
.hint.center{text-align:center;margin:2px 0 0}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--brass);color:var(--ink);padding:9px 16px;border-radius:8px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1}
.pass{text-align:center;padding:10px 0 4px}
.pass .big{font-family:var(--display);font-size:28px;margin:8px 0 4px}
kbd{font:inherit;font-size:12px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.25)}
table.costs{border-collapse:collapse;width:100%;font-size:14px}
table.costs td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
body.side #topbar{position:absolute;top:14px;flex-direction:column;align-items:stretch;gap:8px}
body.side #status{max-width:none;font-size:16px}
body.side #dice{margin-left:0;justify-content:center}
body.side #dice[hidden]{display:flex!important;visibility:hidden}
body.side #bottom{position:absolute;top:14px;bottom:14px;justify-content:flex-start;align-items:stretch}
body.side #hand{width:100%}
body.side .chips{display:grid;grid-template-columns:repeat(5,1fr)}
body.side .chip{min-width:0}
body.side .actions{display:grid;grid-template-columns:1fr 1fr}
body.side .actions .primary,body.side .actions .tok{grid-column:1/-1;margin-left:0!important}
@media (max-width:760px){
  #players{width:150px}
  .pl{padding:6px 8px;font-size:12.5px}
  .pl .pm{display:none}
  #logwrap{width:150px}
  #status{font-size:12.5px;padding:6px 10px;max-width:calc(100vw - 340px)}
  #hand{padding:8px}
  .chip{min-width:46px;padding:4px 5px}
  .chip b{font-size:16px}
  .two{grid-template-columns:1fr}
}
#padring{position:fixed;pointer-events:none;z-index:70;border:3px solid var(--brass);border-radius:10px;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 18px rgba(201,150,46,.85);transition:left .09s,top .09s,width .09s,height .09s;display:none}
body.pad :focus-visible{outline:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

  <div id="players"></div>
  <div id="bottom">
    <div id="modebar" class="panel" hidden><span id="modetext"></span><button id="modecancel" class="small">Cancel</button></div>

  </div>
</div>

<div id="modal-root"></div>

<script>
/* =========================================================
   Hexmoor — a settle-and-trade hex game in one file.
   Sections: utils · board · state/rules · flows · AI · 3D · UI · boot
   ========================================================= */

// ---------- utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = n => Math.floor(Math.random() * n);
const pickRand = a => a[rand(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const pip = n => n ? 6 - Math.abs(7 - n) : 0;
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v; else if (v === false || v == null) continue; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) { if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}

// ---------- constants ----------
const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
const RES_NAME = { wood: 'Wood', brick: 'Brick', sheep: 'Sheep', wheat: 'Wheat', ore: 'Ore' };
const RES_COLOR = { wood: '#3f7a3a', brick: '#b5532e', sheep: '#9ccc65', wheat: '#e6c14a', ore: '#8a94a3' };
const TERRAIN_RES = { forest: 'wood', hills: 'brick', pasture: 'sheep', fields: 'wheat', mountains: 'ore', desert: null, gold: null, lake: null };
const TERRAIN_NAME = { forest: 'Forest', hills: 'Hills', pasture: 'Pasture', fields: 'Fields', mountains: 'Mountains', desert: 'Desert', gold: 'Gold Field', lake: 'Lake' };
const COST = { road: { wood: 1, brick: 1 }, settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 }, city: { wheat: 2, ore: 3 }, dev: { sheep: 1, wheat: 1, ore: 1 }, ship: { wood: 1, sheep: 1 }, bridge: { wood: 1, brick: 2 } };
const PLAYER_COLORS = [{ name: 'Crimson', hex: '#c8392b' }, { name: 'Cobalt', hex: '#2d6cc4' }, { name: 'Amber', hex: '#e8892b' }, { name: 'Ivory', hex: '#f1ecdc' }, { name: 'Plum', hex: '#8e4fc4' }, { name: 'Teal', hex: '#1f9e9a' }];
const DEV_NAME = { knight: 'Knight', vp: 'Victory Point', roads: 'Road Building', plenty: 'Year of Plenty', monopoly: 'Monopoly' };
const AI_NAMES = ['Brunhilde', 'Osric', 'Marisol', 'Tancred', 'Ysolde', 'Corwin'];

// ---------- board geometry ----------
// Hexes use axial coordinates (q, r); each map is a list of land cells. Water is everything else:
// sea that touches the outside gets the harbors, enclosed water (lakes) does not.
const SQ3 = Math.sqrt(3);
// neighbour across hex edge k (the edge between corners k and k+1, whose midpoint lies at angle 60k)
const EDGE_DIR = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
const cellKey = (q, r) => q + ',' + r;
const hexDist = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
function hexCells(radius) { const out = []; for (let r = -radius; r <= radius; r++) for (let q = -radius; q <= radius; q++) if (hexDist(q, r) <= radius) out.push([q, r]); return out; }
// rows of tiles, top to bottom, each centred on the middle column
function rowCells(rows) {
  const out = [], mid = Math.floor(rows.length / 2);
  rows.forEach((len, i) => { const r = i - mid, qs = Math.round(-(len - 1) / 2 - r / 2); for (let k = 0; k < len; k++) out.push([qs + k, r]); });
  return out;
}
// a random compact island grown outward from the middle; it may enclose a lake by chance
function blobCells(n, maxDist, maxRow) {
  const have = new Map([[cellKey(0, 0), [0, 0]]]);
  while (have.size < n) {
    let best = null, bs = -1;
    for (const [q, r] of have.values()) for (const [dq, dr] of EDGE_DIR) {
      const c = [q + dq, r + dr], k = cellKey(...c);
      if (have.has(k) || hexDist(...c) > maxDist || Math.abs(c[1]) > maxRow) continue;
      const s = EDGE_DIR.filter(([a, b]) => have.has(cellKey(c[0] + a, c[1] + b))).length + Math.random() * 2.4;
      if (s > bs) { bs = s; best = [k, c]; }
    }
    have.set(best[0], best[1]);
  }
  return [...have.values()];
}
// Each map's cells(n) takes the player count; 5–6 players get a board about half again as big.
const MAPS = {
  classic: { name: 'Classic Island', blurb: 'The standard island.', theme: 'coast', small: () => rowCells([3, 4, 4, 3]),  cells: n => n > 4 ? rowCells([4, 5, 6, 6, 5, 4]) : hexCells(2) },
  big: { name: 'Big Island', blurb: 'Room to spread out, longer games.', theme: 'coast', small: () => rowCells([4, 5, 6, 5]),  cells: n => rowCells(n > 4 ? [6, 7, 8, 8, 7, 6] : [5, 6, 7, 6, 5]) },
  lakes: {
    name: 'Lakeland', blurb: 'A wide island around inland lakes.', theme: 'coast', small: () => hexCells(2).filter(([q, r]) => q || r), 
    cells: n => {
      if (n > 4) { const lakes = new Set(['0,0', '1,-1', '-1,2', '2,1']); return rowCells([5, 6, 7, 8, 7, 6, 5]).filter(([q, r]) => !lakes.has(cellKey(q, r))); }
      const skip = new Set(['0,0', '1,-1', '-1,2', '3,0', '-3,0', '0,3', '0,-3', '3,-3', '-3,3']); return hexCells(3).filter(([q, r]) => !skip.has(cellKey(q, r)));
    }
  },
  wild: { name: 'Wild Coast', blurb: 'A new coastline every game.', theme: 'coast', small: () => blobCells(14 + rand(3), 3, 3),  cells: n => n > 4 ? blobCells(30 + rand(5), 5, 4) : blobCells(20 + rand(4), 4, 3) },
  // sea maps: ships, gold fields and +2 for settling a new island
  outer: {
    name: 'Outer Isles', blurb: 'Start on the home island, then sail for the outer isles.', theme: 'coast', small: () => outerIslesCells(rowCells([3, 4, 4, 3]), 3, 4),  sea: true, target: 13, homeOnly: true, gold: n => n > 4 ? 3 : 2,
    cells: n => outerIslesCells(n > 4 ? rowCells([4, 5, 6, 6, 5, 4]) : hexCells(2), n > 4 ? 6 : 4, n > 4 ? 5 : 4)
  },

// ---- Variants ----
// Card deck instead of dice: 36 cards, one per dice combination. A New Year card sits above the last 5,
// so those 5 never come up before the reshuffle, which keeps the deck from being fully predictable.
function newFateDeck() {
  const cards = []; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) cards.push([a, b]);
  shuffle(cards); return [...cards.slice(0, 31), 'new-year', ...cards.slice(31)];
}
function drawFate() {
  let c = G.fate.shift();
  if (c === 'new-year') { G.fate = newFateDeck(); log('New Year: the deck is reshuffled.'); toast('New Year! The deck is reshuffled.'); c = G.fate.shift(); }

// Draws a board behind the start screen without touching the game in progress (if any).
